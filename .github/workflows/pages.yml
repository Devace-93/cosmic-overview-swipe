# Publishes site/ (the landing page at https://cosmic-swipe.3m4.net) to GitHub
# Pages on every push to main that touches it, or on demand. The catalogs in
# site/i18n/*.json are checked and joined into site/i18n.js here, so a
# missing or broken translation fails the deploy instead of the page.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/site-i18n.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the translations
        run: |
          python3 tools/site-i18n.py build
          mkdir _site
          cp site/index.html site/style.css site/i18n.js site/icon.svg site/demo.gif site/demo.webm site/CNAME _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
